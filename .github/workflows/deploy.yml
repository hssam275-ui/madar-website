# Builds the site on every push to main and publishes dist/ to the gh-pages branch (GitHub Pages).
# Custom domain: madaribda.com (public/CNAME). DNS lives at Hostinger: 4 A records for @ pointing to
# GitHub Pages (185.199.108-111.153) and CNAME www -> hssam275-ui.github.io.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://madaribda.com' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          # Web3Forms access keys are public by design (they ship in the page HTML).
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY || '37eb1cd2-cd1b-449f-938d-487c55925f24' }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
